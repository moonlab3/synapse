synapse_bt_node:
  ros__parameters:
    bt_tick_frequency_hz: 50
    obs_buffer_window_size: 20
    brain_option: "MANUAL"
    # brain_option: "VLA"  # Options: "VLA", "IL"
    muscle_option: "ISAAC"
    # muscle_option: "DUMMY"  # Placeholder for future muscle options

manual_adapter:
  ros__parameters:
    checkpoint_path: "/path/to/checkpoint"  # Used for RL and VLA options
    muscle_embodiment: "LIBERO_PANDA"

vla_adapter:
  ros__parameters:
    checkpoint_path: "/path/to/checkpoint"  # Used for RL and VLA options
    muscle_embodiment: "LIBERO_PANDA"

isaac_node:
  ros__parameters:
    publish_rate_hz: 100
    usd_path: "/home/rog-sf/vla/OXE.usd"
    robot_name: "panda"
    robot_prim_path: "/World/franka_set/Franka/panda"
    camera_config: "wrist_cam"  # options: "quarter_view_cam"