scn_mover_test:
  scenario_filename: "scn_mover_test.yaml"
  embodiment_name: "DUAL_XARM_V5"
  bt_tick_frequency_hz: 50
  obs_buffer_window_size: 20
  # muscle_option: "DUMMY"
  muscle_option: "ISAAC"

  brain_registry:
    - "mover:MOVE"
    - "rosbag_1:ROSBAG"

  # Speeds are per-Action overridable in the scenario; these are the fallbacks.
  mover:
    linear_speed: 0.05        # m/s of eef travel
    angular_speed: 0.5        # rad/s of eef rotation
    joint_speed: 1.0          # rad/s for joint_targets legs (hands)
    min_duration: 0.5         # s, floor for very short moves
    ik_tolerance: 0.005       # m, residual that refuses a target or holds mid-move
    ik_iterations: 4          # re-seeded solves per waypoint

  rosbag_1:
    bag_filename: "bottle_1.json"
    topic_component_map:
      - "/xarm7_left_controller/commands:left_arm"
      - "/xarm7_right_controller/commands:right_arm"
      - "/allegro_hand_position_effort_controller_l/commands:left_hand"
      - "/allegro_hand_position_effort_controller_r/commands:right_hand"
    seek_velocity: 0.2
    seek_min_duration: 0.5

  publish_rate_hz: 100
  render_rate_hz: 20        # must divide publish_rate_hz and be a multiple of every camera frequency

avp_test:
  embodiment_name: "DUAL_XARM_V6"
  bt_tick_frequency_hz: 50
  obs_buffer_window_size: 20
  muscle_option: "ISAAC"

  brain_registry:
    - "avp:AVP"
    - "random_brain_adapter:RANDOM"
    - "rosbag_player:ROSBAG"

  avp:
    avp_ip: "1.1.20.52"      # shown in the Tracking Streamer app
    arm_map:                    # AVP hand : component
      - "left:left_arm"
      - "right:right_arm"
    hand_map:
      - "left:left_hand"
      - "right:right_hand"
    avp_yaw_deg: -90.0          # AVP frame (x right, y forward) -> arm base frame
    scale: 1.0                  # arm travel per unit of wrist travel
    max_linear_speed: 0.25      # m/s of eef travel
    max_angular_speed: 2.5      # rad/s of eef rotation
    max_finger_speed: 5.0       # rad/s, every hand joint
    stale_timeout: 0.2          # s without new data before holding
    ik_tolerance: 0.005         # m, residual that holds the arm
    ik_iterations: 4            # re-seeded solves per waypoint
    # robot = gain * operator angle + offset, per joint Y of joint_XY
    finger_gain: [1.0, 1.0, 1.0, 1.0]     # spread, then three bends
    finger_offset: [0.0, 0.0, 0.0, 0.0]
    thumb_gain: [4.0, 1.0, 1.0, 1.0]      # bend whole thumb, rotate (unused: follows joint 0), two bends
    thumb_offset: [0.0, 0.0, 0.0, 0.0]

  rosbag_player:
    bag_filename: "snack1.json"
    topic_component_map:
      - "/xarm7_left_controller/commands:left_arm"
      - "/xarm7_right_controller/commands:right_arm"
      - "/allegro_hand_position_effort_controller_l/commands:left_hand"
      - "/allegro_hand_position_effort_controller_r/commands:right_hand"
    seek_velocity: 0.2
    seek_min_duration: 0.5
  publish_rate_hz: 100
  render_rate_hz: 20        # must divide publish_rate_hz and be a multiple of every camera frequency

avp_real:
  embodiment_name: "DUAL_XARM_V6_REAL"
  bt_tick_frequency_hz: 50
  obs_buffer_window_size: 20
  muscle_option: "REAL_ROBOT"

  brain_registry:
    - "avp:AVP"
    - "random_brain_adapter:RANDOM"
    - "rosbag_player:ROSBAG"

  avp:
    avp_ip: "1.1.21.209"      # shown in the Tracking Streamer app
    arm_map:                    # AVP hand : component
      - "left:left_arm"
      - "right:right_arm"
    hand_map:
      - "left:left_hand"
      - "right:right_hand"
    avp_yaw_deg: -90.0          # AVP frame (x right, y forward) -> arm base frame
    scale: 1.0                  # arm travel per unit of wrist travel
    max_linear_speed: 0.08      # m/s of eef travel
    max_angular_speed: 0.8      # rad/s of eef rotation
    max_finger_speed: 1.0       # rad/s, every hand joint
    trajectory_lookahead: 2.0   # arm point duration, in waypoint periods; under 1 is stop-and-go
    stale_timeout: 0.2          # s without new data before holding
    ik_tolerance: 0.005         # m, residual that holds the arm
    ik_iterations: 4            # re-seeded solves per waypoint
    # robot = gain * operator angle + offset, per joint Y of jointXY
    finger_gain: [1.0, 1.0, 1.0, 1.0]     # spread, then three bends
    finger_offset: [0.0, 0.0, 0.0, 0.0]
    thumb_gain: [1.0, 1.0, 1.0, 1.0]      # bend whole thumb, rotate (unused: follows joint 0), two bends
    thumb_offset: [0.0, 0.0, 0.0, 0.0]

  rosbag_player:
    bag_filename: "snack1.json"
    topic_component_map:
      - "/xarm7_left_controller/commands:left_arm"
      - "/xarm7_right_controller/commands:right_arm"
      - "/allegro_hand_position_effort_controller_l/commands:left_hand"
      - "/allegro_hand_position_effort_controller_r/commands:right_hand"
    seek_velocity: 0.2
    seek_min_duration: 0.5

  publish_rate_hz: 100
  render_rate_hz: 20        # must divide publish_rate_hz and be a multiple of every camera frequency


