      - "/allegro_hand_position_effort_controller_l/commands:left_hand"
      - "/allegro_hand_position_effort_controller_r/commands:right_hand"
    seek_velocity: 0.2
    seek_min_duration: 0.5
  rosbag_3:
    bag_filename: "bottle_3.json"
    topic_component_map:
      - "/xarm7_left_controller/commands:left_arm"
      - "/xarm7_right_controller/commands:right_arm"
    seek_velocity: 0.2
