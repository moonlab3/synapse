# Shared by every profile below (the launch file merges it in; a profile may override
# single keys with its own paths: block). Values accept ~ and ${ENV}.
paths:
  isaac_sim_root: "~/installs/isaacsim_6"          # holds python.sh; ISAAC muscle runs through it
  groot: "~/vla/Isaac-GR00T"                       # GR00T adapter imports gr00t from here
  rl_platform: "~/ws/rl-platform/source/rl_platform"  # RL adapter imports rl_platform from here
  # assets: "~/ws/synapse_ws/assets"               # default: the assets/ dir above the package

default:
  obs_buffer_window_size: 20
  bt_tick_frequency_hz: 50
  muscle_option: "DUMMY"
  embodiment_name: "SINGLE_PANDA_CAM"
  brain_registry:
    - "manual:MANUAL"
  publish_rate_hz: 100
  render_rate_hz: 20        # must divide publish_rate_hz and be a multiple of every camera frequency

