      yourdfpy_description: false
      states: "/synapse/joint_states/xarm_v6_left"
      components:
        left_arm:
          type: "manipulator"
          eef_frame: "link_eef"
          name: "xarm7_v6_left"
          joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "joint7"]
          joint_indices: [0, 1, 2, 3, 4, 5, 6]
          target:
            ISAAC: "/synapse/target/left_arm"
            DUMMY: "/synapse/target/left_arm"
            REAL_ROBOT:
              topic: "/left_xarm7_traj_controller/joint_trajectory"
              msg_type: "JointTrajectory"
        left_hand:
          type: "end-effector"
          name: "allegro_v6_left"
          single_finger_dofs: 4
