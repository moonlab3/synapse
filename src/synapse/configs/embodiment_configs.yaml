            {joint_00: [-1.571, 0.0], joint_01: [-3.142, 0.0], joint_02: [-1.571, 0.0], joint_03: [-1.571, 0.0],
             joint_10: [-0.349, 1.571], joint_20: [-1.396, 1.396], joint_30: [-1.396, 0.349], joint_40: [-1.571, 0.349],
