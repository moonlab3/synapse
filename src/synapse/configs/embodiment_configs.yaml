SINGLE_FR5:
  table_height: 0.85
  usd_filename: "fr5.usd"
  manipulator_step_size: 0.1   # for manual
  eef_step_size: 0.01           # for manual
  robots:
    fr5:
      prim_path: "/World/fairino5_v6"
      states: "/synapse/joint_states/fr5"
      yourdfpy_description: false
      urdf_filename: "fairino5_v6.urdf"
      components:
        arm:
          type: "manipulator"
          name: "fairino5_v6"
          joint_names: ["j1", "j2", "j3", "j4", "j5", "j6"]
          joint_indices: [0, 1, 2, 3, 4, 5]
          eef_frame: "wrist3_link"
          target:
            ISAAC: "/synapse/target"
            DUMMY: "/syanapse/target"

