             joint_12: [0.0, 1.571], joint_22: [0.0, 1.571], joint_32: [0.0, 1.571], joint_42: [0.0, 1.571],
             joint_13: [0.0, 1.571], joint_23: [0.0, 1.571], joint_33: [0.0, 1.571], joint_43: [0.0, 1.571]}
